    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #1a1a1a;
            color: white;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        nav {
            background: #2a2a2a;
            padding: 15px 0;
            margin-bottom: 30px;
        }

        .nav-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .logo {
            color: #1db954;
            font-size: 24px;
            font-weight: bold;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .auth-container {
            max-width: 400px;
            margin: 100px auto;
            padding: 20px;
            background: #2a2a2a;
            border-radius: 10px;
        }

        .choice-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            max-width: 800px;
            margin: 100px auto;
        }

        .choice-card {
            background: #2a2a2a;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .choice-card:hover {
            transform: translateY(-5px);
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
            background: #3a3a3a;
            color: white;
        }

        .btn {
            background: #1db954;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
            font-size: 16px;
        }

        .btn:hover {
            background: #1ed760;
        }

        .btn-danger {
            background: #dc3545;
        }

        .btn-danger:hover {
            background: #bb2d3b;
        }

        .upload-container, .player-container {
            background: #2a2a2a;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 600px) {
            .choice-container {
                grid-template-columns: 1fr;
                padding: 20px;
            }

            .nav-content {
                flex-direction: column;
                gap: 10px;
                text-align: center;
            }

            .user-info {
                flex-direction: column;
            }
        }
        .footer {
    background: #1a1a1a;
    color: #888;
    text-align: center;
    padding: 15px;
    position: fixed;
    bottom: 0;
    width: 100%;
    border-top: 1px solid #333;
    font-size: 14px;
    z-index: 1000;
}

.footer a {
    color: #1db954;
    text-decoration: none;
}

.footer a:hover {

}

    <div class="container">
        <!-- Login Container -->
        <div id="loginContainer" class="auth-container">
            <h2 style="margin-bottom: 20px; text-align: center;">Login</h2>
            <input type="text" id="username" placeholder="Username">
            <input type="password" id="password" placeholder="Password">
            <button class="btn" onclick="login()" style="width: 100%;">Login</button>
            <p style="text-align: center; margin-top: 10px;">
                Don't have an account? <a href="#" onclick="showRegisterForm()" style="color: #1db954;">Register</a>
            </p>
        </div>

        <!-- Register Container -->
        <div id="registerContainer" class="auth-container hidden">
            <h2 style="margin-bottom: 20px; text-align: center;">Register</h2>
            <input type="text" id="regUsername" placeholder="Username">
            <input type="password" id="regPassword" placeholder="Password">
            <button class="btn" onclick="register()" style="width: 100%;">Register</button>
            <p style="text-align: center; margin-top: 10px;">
                Already have an account? <a href="#" onclick="showLoginForm()" style="color: #1db954;">Login</a>
            </p>
        </div>

        <!-- Choice Container -->
        <div id="choiceContainer" class="choice-container hidden">
            <div class="choice-card" onclick="showUploadView()">
                <h3 style="color: #1db954; margin-bottom: 15px;">Upload Music</h3>
                <p>Share your music with others</p>
            </div>
            <div class="choice-card" onclick="showPlayerView()">
                <h3 style="color: #1db954; margin-bottom: 15px;">Listen Music</h3>
                <p>Join a room and listen with others</p>
            </div>
        </div>

        <!-- Upload Container -->

            <!-- Content from the first HTML file -->
        </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-database.js";

        const firebaseConfig = {
    apiKey: process.env.FIREBASE_API_KEY,
    authDomain: process.env.FIREBASE_AUTH_DOMAIN,
    databaseURL: process.env.FIREBASE_DATABASE_URL,
    projectId: process.env.FIREBASE_PROJECT_ID,
    storageBucket: process.env.FIREBASE_STORAGE_BUCKET,
    messagingSenderId: process.env.FIREBASE_MESSAGING_SENDER_ID,
    appId: process.env.FIREBASE_APP_ID,
    measurementId: process.env.FIREBASE_MEASUREMENT_ID
};

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.login = async () => {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            const userRef = ref(db, `users/${username}`);
            const snapshot = await get(userRef);

            if (snapshot.exists() && snapshot.val().password === password) {
                localStorage.setItem('currentUser', username);
                checkAuthState();
            } else {
                alert('Invalid credentials');
            }
        };

        window.register = async () => {
            const username = document.getElementById('regUsername').value;
            const password = document.getElementById('regPassword').value;

            if (username.match(/[^a-zA-Z0-9]/)) {
                alert('Username can only contain letters and numbers');
                return;
            }

            const userRef = ref(db, `users/${username}`);
            const snapshot = await get(userRef);

            if (snapshot.exists()) {
                alert('Username already exists');
                return;
            }

            await set(userRef, { password });
            alert('Registration successful! Please login.');
            showLoginForm();
        };

        window.logout = () => {
            localStorage.removeItem('currentUser');
            localStorage.removeItem('currentRoom');
            checkAuthState();
        };

        window.showLoginForm = () => {
            document.getElementById('loginContainer').classList.remove('hidden');
            document.getElementById('registerContainer').classList.add('hidden');
        };

        window.showRegisterForm = () => {
            document.getElementById('loginContainer').classList.add('hidden');
            document.getElementById('registerContainer').classList.remove('hidden');
        };

        window.showUploadView = () => {
            document.getElementById('choiceContainer').classList.add('hidden');
            document.getElementById('uploadContainer').classList.remove('hidden');
            window.location.href="./upload.html";
        };

        window.showPlayerView = () => {
            document.getElementById('choiceContainer').classList.add('hidden');
            document.getElementById('playerContainer').classList.remove('hidden');
            window.location.href="./player.html";
        };

        function checkAuthState() {
            const currentUser = localStorage.getItem('currentUser');
            const currentRoom = localStorage.getItem('currentRoom');

            const containers = ['loginContainer', 'registerContainer', 'choiceContainer', 'uploadContainer', 'playerContainer'];
            containers.forEach(id => document.getElementById(id).classList.add('hidden'));

            if (currentUser) {
                document.getElementById('userDisplay').textContent = `Welcome, ${currentUser}!`;
                document.getElementById('logoutBtn').style.display = 'block';

                if (currentRoom) {
                    document.getElementById('playerContainer').classList.remove('hidden');
                    loadPlayerContent();
                } else {
                    document.getElementById('choiceContainer').classList.remove('hidden');
                }
            } else {
                document.getElementById('userDisplay').textContent = '';
                document.getElementById('logoutBtn').style.display = 'none';
                document.getElementById('loginContainer').classList.remove('hidden');
            }
        }
